name: unilearn
description: UniLearn — A universal study companion for every kid, everywhere.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.2
  google_fonts: ^6.1.0
  fl_chart: ^0.66.2
  intl: ^0.19.0
  percent_indicator: ^4.2.3
  animated_text_kit: ^4.2.2
  flutter_svg: ^2.0.9
  provider: ^6.1.1
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  confetti: ^0.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.7

flutter:
  uses-material-design: true
  assets:
    - assets/images/
